services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"

  prefect-server:
    image: prefecthq/prefect:3.0.0-python3.10
    container_name: prefect_server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0

  pipeline-runner:
    build: .
    container_name: pipeline_runner
    command: >
      sh -c "sleep 30 && python pipeline.py"
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - DB_URL=postgresql://admin:adminpassword@postgres:5432/finance_db
    depends_on:
      - postgres
      - prefect-server